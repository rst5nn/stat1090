# stat1090 collectd configuration
Hostname "localhost"
FQDNLookup false
Interval 60

TypesDB "/usr/share/stat1090/dump1090.db" "/usr/share/collectd/types.db"

LoadPlugin syslog
LoadPlugin rrdtool

<Plugin rrdtool>
    DataDir "/run/collectd"
    RRARows 3000
    RRATimespan 174000
    RRATimespan 696000
    RRATimespan 2784000
    RRATimespan 16008000
    RRATimespan 96048000
    RRATimespan 576288000
    XFF 0.8
</Plugin>

<LoadPlugin python>
    Globals true
</LoadPlugin>

<Plugin python>
    ModulePath "/usr/share/stat1090/modules"
    LogTraces true

    Import "dump1090"
    <Module dump1090>
        <Instance localhost>
            URL "file:///usr/share/stat1090/data-symlink"
        </Instance>
    </Module>

    Import "traffic"
    <Module traffic>
        placeholder "true"
    </Module>

    Import "temperature"
    <Module temperature>
        placeholder "true"
    </Module>
</Plugin>
