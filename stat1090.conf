[traffic]
# Minimum and maximum ground speed filters (knots)
min_speed = 125
max_speed = 250

# Minimum rate of climb / descent (ft/min)
min_rate = 200

# Maximum transition altitude (ft)
max_alt = 4500

# Require flight callsign to match commercial_prefixes (true/false)
filter_commercial_prefixes = false

# Commercial 3-letter ICAO callsign prefixes (comma-separated)
commercial_prefixes = RYR,WZZ,LOT,DLH,KLM,SAS,ENT,EWG,TVP,SDM,AFR,BAW,FIN,AEE,LGL,AUA,SWR,TAP,IBE,WUK,TRA,PBD

# Allowed ADS-B Emitter Categories (comma-separated, e.g. A2,A3,A4,A5). Set to ALL to allow all.
allowed_categories = A2,A3,A4,A5
